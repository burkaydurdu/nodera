# Infrastructure only. The Go services run natively via `make`; docker-compose
# never carries an application service.
#
# Host ports are the standard ones plus ten, so Nodera runs next to other local
# stacks that hold the standard ports; every dev.toml points at these. Override
# one with its *_HOST_PORT variable (a gitignored .env works).
name: nodera

services:
  postgres:
    image: postgres:18
    restart: always
    ports:
      - "${POSTGRES_HOST_PORT:-5442}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres

  redis:
    image: redis:8.2
    restart: always
    ports:
      - "${REDIS_HOST_PORT:-6389}:6379"
    volumes:
      - redis-data:/data

  # Single-node replica set: the outbox library needs transactions
  # (docs/adr/0001). `make mongo-init` runs rs.initiate once after first boot.
  mongo:
    image: mongo:8.2
    restart: always
    ports:
      - "${MONGO_HOST_PORT:-27027}:27017"
    volumes:
      - mongo-data:/data/db
    command: ["--replSet", "rs0", "--bind_ip_all"]

  rabbitmq:
    image: rabbitmq:4.1-management
    restart: always
    ports:
      - "${RABBITMQ_AMQP_HOST_PORT:-5682}:5672"
      - "${RABBITMQ_MANAGEMENT_HOST_PORT:-15682}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
      - RABBITMQ_DEFAULT_VHOST=/nodera

  mailhog:
    image: mailhog/mailhog
    ports:
      - "${MAILHOG_SMTP_HOST_PORT:-1035}:1025"
      - "${MAILHOG_WEB_HOST_PORT:-8035}:8025"

  # Nodera Mail's MTA (docs/adr/0009). In development it hands every Message to
  # MailHog instead of the real MX hosts, and posts its log records to the mail
  # service running natively on the host.
  kumomta:
    image: ghcr.io/kumocorp/kumomta:2026.09.29-b90d8bc1
    restart: always
    ports:
      - "${KUMOMTA_HTTP_HOST_PORT:-8010}:8000"
      - "${KUMOMTA_SMTP_HOST_PORT:-2535}:25"
    volumes:
      - ./deploy/kumomta:/opt/kumomta/etc/policy:ro
      - kumomta-spool:/var/spool/kumomta
      - kumomta-logs:/var/log/kumomta
    environment:
      - NODERA_ENV=dev
      - MAIL_INTERNAL_URL=http://host.docker.internal:9702
      - MAIL_INTERNAL_TOKEN=dev-mail-internal-token
      - KUMO_INJECT_USER=mail-service
      - KUMO_INJECT_PASSWORD=dev-mta-password
      - KUMO_HOSTNAME=mx.mta.nodera.local
      - KUMO_SMART_HOST=mailhog:1025
      - MAIL_ZONE=mta.nodera.local
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Renders Invoice PDFs from HTML for the billing service.
  gotenberg:
    image: gotenberg/gotenberg:8
    restart: always
    ports:
      - "${GOTENBERG_HOST_PORT:-3300}:3000"

volumes:
  postgres-data:
  redis-data:
  mongo-data:
  rabbitmq-data:
  kumomta-spool:
  kumomta-logs:
