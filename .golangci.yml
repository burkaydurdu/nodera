version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - gosec
    - misspell
    - unconvert
    - unparam
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - bodyclose
          - gosec
          - unparam
      - path: mock/
        linters:
          - all

formatters:
  enable:
    - gofmt
    - goimports
