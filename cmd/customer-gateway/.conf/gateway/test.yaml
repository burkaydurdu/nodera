gateway:
  name: nodera-customer-gateway
  services:
    customer:
      host: http://nodera-customer:9650
      endpoints:
        # Public: no token. Their audit attribution is by design empty.
        - path: /v1/auth/register
          method: POST
          public: true
        - path: /v1/auth/verify-email
          method: POST
          public: true
        - path: /v1/auth/verify-email/resend
          method: POST
          public: true
        - path: /v1/auth/login
          method: POST
          public: true
        - path: /v1/auth/mfa/verify
          method: POST
          public: true
        - path: /v1/auth/mfa/resend
          method: POST
          public: true
        - path: /v1/auth/refresh
          method: POST
          public: true
        - path: /v1/auth/forgot-password
          method: POST
          public: true
        - path: /v1/auth/reset-password
          method: POST
          public: true
        # Authenticated: a live session is required; permissions come later.
        - path: /v1/auth/logout
          method: POST
        - path: /v1/auth/logout-all
          method: POST
        - path: /v1/users/me
          method: GET
        - path: /v1/users/me
          method: PUT
        - path: /v1/users/me/password
          method: POST
        - path: /v1/users/me/mfa
          method: PUT
        - path: /v1/users/me/sessions
          method: GET
        - path: /v1/users/me/sessions/:sessionID
          method: DELETE
        - path: /v1/teams
          method: GET
        - path: /v1/teams
          method: POST
        # Team routes carry the Permission the caller's Role must hold
        # (docs/adr/0005); the gateway reads the Role from the token's teams
        # claim for the :teamID in the path.
        - path: /v1/teams/:teamID/projects
          method: GET
          permissions:
            - team.read
        - path: /v1/teams/:teamID/projects
          method: POST
          permissions:
            - project.write
        # API keys let software act on their Project: listing them needs
        # apikey.write too, so a Role without it, finance, never sees them.
        - path: /v1/teams/:teamID/projects/:projectID/api-keys
          method: GET
          permissions:
            - apikey.write
        - path: /v1/teams/:teamID/projects/:projectID/api-keys
          method: POST
          permissions:
            - apikey.write
        - path: /v1/teams/:teamID/projects/:projectID/api-keys/:keyID
          method: DELETE
          permissions:
            - apikey.write
        - path: /v1/teams/:teamID/ssh-keys
          method: GET
          permissions:
            - team.read
        - path: /v1/teams/:teamID/ssh-keys
          method: POST
          permissions:
            - sshkey.write
        - path: /v1/teams/:teamID/ssh-keys/:keyID
          method: DELETE
          permissions:
            - sshkey.write
        - path: /v1/teams/:teamID/members
          method: GET
          permissions:
            - team.read
        - path: /v1/teams/:teamID/members/:userID/role
          method: PUT
          permissions:
            - team.manage
        - path: /v1/teams/:teamID/members/:userID
          method: DELETE
          permissions:
            - team.manage
        - path: /v1/teams/:teamID/members/leave
          method: POST
          permissions:
            - team.read
        - path: /v1/teams/:teamID/invitations
          method: GET
          permissions:
            - team.manage
        - path: /v1/teams/:teamID/invitations
          method: POST
          permissions:
            - team.manage
        - path: /v1/teams/:teamID/invitations/:invitationID/resend
          method: POST
          permissions:
            - team.manage
        - path: /v1/teams/:teamID/invitations/:invitationID
          method: DELETE
          permissions:
            - team.manage
        - path: /v1/users/me/invitations
          method: GET
        - path: /v1/users/me/invitations/:invitationID/accept
          method: POST
        - path: /v1/users/me/invitations/:invitationID/decline
          method: POST
        # Token-scoped: the link is the whole secret, so the lookup needs no
        # session; accepting and declining still need a signed-in invitee.
        - path: /v1/invitations/lookup
          method: GET
          public: true
        - path: /v1/invitations/accept
          method: POST
        - path: /v1/invitations/decline
          method: POST
    # Selected by X-Target-Server: droplet. Every route needs a live session:
    # the catalog is priced for signed-in customers only.
    droplet:
      host: http://localhost:9660
      endpoints:
        - path: /v1/catalog/regions
          method: GET
        - path: /v1/catalog/plans
          method: GET
        - path: /v1/catalog/images
          method: GET
        - path: /v1/projects/:projectID/droplets
          method: GET
        - path: /v1/projects/:projectID/droplets
          method: POST
        - path: /v1/droplets/:dropletID
          method: GET
        - path: /v1/droplets/:dropletID/actions
          method: POST
        - path: /v1/droplets/:dropletID
          method: DELETE
    # Selected by X-Target-Server: billing. Team routes carry the Permission
    # the caller's Role must hold; the billing status is team.read so every
    # member sees why spending is blocked. Provider webhooks and the 3-D
    # Secure confirmation link are public: the provider and the cardholder's
    # bank call them, and the service checks their signature or token.
    billing:
      host: http://localhost:9670
      endpoints:
        - path: /v1/teams/:teamID/billing/profile
          method: GET
          permissions:
            - billing.read
        - path: /v1/teams/:teamID/billing/profile
          method: PUT
          permissions:
            - billing.write
        - path: /v1/teams/:teamID/billing/payment-methods
          method: GET
          permissions:
            - billing.read
        - path: /v1/teams/:teamID/billing/payment-methods/verify
          method: POST
          permissions:
            - billing.write
        - path: /v1/teams/:teamID/billing/payment-methods/verify/complete
          method: POST
          permissions:
            - billing.write
        - path: /v1/teams/:teamID/billing/payment-methods/:methodID/default
          method: PUT
          permissions:
            - billing.write
        - path: /v1/teams/:teamID/billing/payment-methods/:methodID
          method: DELETE
          permissions:
            - billing.write
        - path: /v1/teams/:teamID/billing/usage
          method: GET
          permissions:
            - billing.read
        - path: /v1/teams/:teamID/billing/invoices
          method: GET
          permissions:
            - billing.read
        - path: /v1/teams/:teamID/billing/invoices/:invoiceID
          method: GET
          permissions:
            - billing.read
        - path: /v1/teams/:teamID/billing/invoices/:invoiceID/pdf
          method: GET
          permissions:
            - billing.read
        - path: /v1/teams/:teamID/billing/invoices/:invoiceID/pay
          method: POST
          permissions:
            - billing.write
        - path: /v1/teams/:teamID/billing/status
          method: GET
          permissions:
            - team.read
        - path: /v1/billing/payments/:paymentID/confirm
          method: GET
          public: true
        # The web app starts 3-D Secure itself, so it sends the target header.
        - path: /v1/billing/payments/:paymentID/3ds/start
          method: POST
          public: true
        # Headerless: the card issuer's page posts the 3-D Secure result back
        # through the browser and cannot add the target header.
        - path: /v1/billing/payments/:paymentID/3ds/callback
          method: POST
          public: true
          headerless: true
        # Signed link from the issue email, opened by the web app's download page.
        - path: /v1/billing/invoices/:invoiceID/pdf
          method: GET
          public: true
        # Headerless: payment providers call these and cannot add the target header.
        - path: /v1/billing/webhooks/craftgate
          method: POST
          public: true
          headerless: true
        - path: /v1/billing/webhooks/stripe
          method: POST
          public: true
          headerless: true
    # Selected by X-Target-Server: notification. The Inbox is the caller's
    # own across every Team, so no route names a Team or a Permission.
    notification:
      host: http://localhost:9680
      endpoints:
        - path: /v1/notifications
          method: GET
        - path: /v1/notifications/unread-count
          method: GET
        - path: /v1/notifications/read-all
          method: PUT
        - path: /v1/notifications/:notificationID/read
          method: PUT
    # The web app's live socket (docs/adr/0007). Headerless and public: a
    # browser can set no header on a WebSocket handshake, so the realtime
    # service authenticates the access token in the socket's first frame.
    realtime:
      host: http://localhost:9690
      endpoints:
        - path: /v1/realtime
          method: GET
          public: true
          headerless: true
    # Selected by X-Target-Server: mail. No route names a Team, so none lists
    # permissions: the mail service authorizes each one itself through its
    # Project access read model, mail.read to read and mail.write to change.
    mail:
      host: http://localhost:9700
      endpoints:
        - path: /v1/mail/packages
          method: GET
        - path: /v1/projects/:projectID/mail
          method: GET
        - path: /v1/projects/:projectID/mail/package
          method: PUT
        - path: /v1/projects/:projectID/mail/domains
          method: GET
        - path: /v1/projects/:projectID/mail/domains
          method: POST
        - path: /v1/projects/:projectID/mail/domains/:domainID
          method: GET
        - path: /v1/projects/:projectID/mail/domains/:domainID
          method: DELETE
        - path: /v1/projects/:projectID/mail/domains/:domainID/verify
          method: POST
        - path: /v1/projects/:projectID/mail/messages
          method: GET
        - path: /v1/projects/:projectID/mail/messages/:messageID
          method: GET
        - path: /v1/projects/:projectID/mail/suppressions
          method: GET
        - path: /v1/projects/:projectID/mail/suppressions/:suppressionID
          method: DELETE
        - path: /v1/projects/:projectID/mail/webhooks
          method: GET
        - path: /v1/projects/:projectID/mail/webhooks
          method: POST
        - path: /v1/projects/:projectID/mail/webhooks/:webhookID
          method: PUT
        - path: /v1/projects/:projectID/mail/webhooks/:webhookID
          method: DELETE
        - path: /v1/projects/:projectID/mail/webhooks/:webhookID/deliveries
          method: GET
    # Selected by X-Target-Server: storage. No route names a Team, so none lists
    # permissions: the storage service authorizes each one itself through its
    # Project access read model, storage.read to read and storage.write to change.
    storage:
      host: http://localhost:9710
      endpoints:
        - path: /v1/storage/regions
          method: GET
        - path: /v1/storage/packages
          method: GET
        - path: /v1/projects/:projectID/storages
          method: GET
        - path: /v1/projects/:projectID/storages
          method: POST
        - path: /v1/projects/:projectID/storages/:storageID
          method: GET
        - path: /v1/projects/:projectID/storages/:storageID
          method: DELETE
        - path: /v1/projects/:projectID/storages/:storageID/package
          method: PUT
        - path: /v1/projects/:projectID/storages/:storageID/access-keys
          method: GET
        - path: /v1/projects/:projectID/storages/:storageID/access-keys
          method: POST
        - path: /v1/projects/:projectID/storages/:storageID/access-keys/:accessKeyID
          method: DELETE
        - path: /v1/projects/:projectID/storages/:storageID/objects
          method: GET
        - path: /v1/projects/:projectID/storages/:storageID/objects/delete
          method: POST
        - path: /v1/projects/:projectID/storages/:storageID/objects/download-url
          method: POST
        - path: /v1/projects/:projectID/storages/:storageID/objects/upload-url
          method: POST
        - path: /v1/projects/:projectID/storages/:storageID/objects/access
          method: GET
        - path: /v1/projects/:projectID/storages/:storageID/objects/access
          method: PUT
        - path: /v1/projects/:projectID/storages/:storageID/browser-access
          method: PUT
        - path: /v1/projects/:projectID/storages/:storageID/usage
          method: GET
