gateway:
  name: nodera-customer-gateway
  services:
    customer:
      host: http://nodera-customer:9650
      endpoints:
        # Public: no token. Their audit attribution is by design empty.
        - path: /v1/auth/register
          method: POST
          public: true
        - path: /v1/auth/verify-email
          method: POST
          public: true
        - path: /v1/auth/verify-email/resend
          method: POST
          public: true
        - path: /v1/auth/login
          method: POST
          public: true
        - path: /v1/auth/mfa/verify
          method: POST
          public: true
        - path: /v1/auth/mfa/resend
          method: POST
          public: true
        - path: /v1/auth/refresh
          method: POST
          public: true
        - path: /v1/auth/forgot-password
          method: POST
          public: true
        - path: /v1/auth/reset-password
          method: POST
          public: true
        # Authenticated: a live session is required; permissions come later.
        - path: /v1/auth/logout
          method: POST
        - path: /v1/auth/logout-all
          method: POST
        - path: /v1/users/me
          method: GET
        - path: /v1/users/me
          method: PUT
        - path: /v1/users/me/password
          method: POST
        - path: /v1/users/me/mfa
          method: PUT
        - path: /v1/users/me/sessions
          method: GET
        - path: /v1/users/me/sessions/:sessionID
          method: DELETE
        - path: /v1/teams
          method: GET
        - path: /v1/teams
          method: POST
        # Team routes carry the Permission the caller's Role must hold
        # (docs/adr/0005); the gateway reads the Role from the token's teams
        # claim for the :teamID in the path.
        - path: /v1/teams/:teamID/projects
          method: GET
          permissions:
            - team.read
        - path: /v1/teams/:teamID/projects
          method: POST
          permissions:
            - project.write
        - path: /v1/teams/:teamID/ssh-keys
          method: GET
          permissions:
            - team.read
        - path: /v1/teams/:teamID/ssh-keys
          method: POST
          permissions:
            - sshkey.write
        - path: /v1/teams/:teamID/ssh-keys/:keyID
          method: DELETE
          permissions:
            - sshkey.write
        - path: /v1/teams/:teamID/members
          method: GET
          permissions:
            - team.read
        - path: /v1/teams/:teamID/members/:userID/role
          method: PUT
          permissions:
            - team.manage
        - path: /v1/teams/:teamID/members/:userID
          method: DELETE
          permissions:
            - team.manage
        - path: /v1/teams/:teamID/members/leave
          method: POST
          permissions:
            - team.read
        - path: /v1/teams/:teamID/invitations
          method: GET
          permissions:
            - team.manage
        - path: /v1/teams/:teamID/invitations
          method: POST
          permissions:
            - team.manage
        - path: /v1/teams/:teamID/invitations/:invitationID/resend
          method: POST
          permissions:
            - team.manage
        - path: /v1/teams/:teamID/invitations/:invitationID
          method: DELETE
          permissions:
            - team.manage
        - path: /v1/users/me/invitations
          method: GET
        - path: /v1/users/me/invitations/:invitationID/accept
          method: POST
        - path: /v1/users/me/invitations/:invitationID/decline
          method: POST
        # Token-scoped: the link is the whole secret, so the lookup needs no
        # session; accepting and declining still need a signed-in invitee.
        - path: /v1/invitations/lookup
          method: GET
          public: true
        - path: /v1/invitations/accept
          method: POST
        - path: /v1/invitations/decline
          method: POST
    # Selected by X-Target-Server: droplet. Every route needs a live session:
    # the catalog is priced for signed-in customers only.
    droplet:
      # PLACEHOLDER: the droplet service's production address, once it is deployed.
      host: http://nodera-droplet:9660
      endpoints:
        - path: /v1/catalog/regions
          method: GET
        - path: /v1/catalog/plans
          method: GET
        - path: /v1/catalog/images
          method: GET
        - path: /v1/projects/:projectID/droplets
          method: GET
        - path: /v1/projects/:projectID/droplets
          method: POST
        - path: /v1/droplets/:dropletID
          method: GET
        - path: /v1/droplets/:dropletID/actions
          method: POST
        - path: /v1/droplets/:dropletID
          method: DELETE
