{{ define "head" }}
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body { margin: 0; padding: 0; width: 100% !important; background-color: #F5F7FB; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
    .wrapper-cell { padding: 48px 16px; }
    .card { width: 552px; max-width: 552px; background-color: #FFFFFF; border: 1px solid #E6E9F2; border-radius: 16px; overflow: hidden; }
    .masthead { background-color: #0B1F3A; padding: 28px 32px; color: #FFFFFF; font-size: 20px; font-weight: 700; letter-spacing: 0.5px; }
    .content { padding: 32px; }
    .title { margin: 0; font-size: 18px; line-height: 26px; color: #172033; }
    .subtitle { margin: 12px 0 0 0; font-size: 15px; line-height: 22px; color: #5B6478; }
    .action { padding-top: 28px; }
    .btn { display: block; width: 100%; box-sizing: border-box; padding: 12px 24px; background-color: #2563EB; border-radius: 8px; color: #FFFFFF; font-size: 15px; font-weight: 600; text-align: center; text-decoration: none; }
    .code-box { background-color: #F1F5FF; border-radius: 8px; }
    .code-box td { padding: 14px 24px; font-size: 28px; line-height: 34px; font-weight: 700; letter-spacing: 6px; color: #172033; text-align: center; }
    .footer { background-color: #F8FAFF; padding: 20px 32px; }
    .footer p { margin: 0; font-size: 12px; line-height: 18px; color: #5B6478; }
    @media only screen and (max-width: 600px) { .card { width: 100% !important; } .wrapper-cell { padding: 24px 12px !important; } }
  </style>
</head>
{{ end }}
