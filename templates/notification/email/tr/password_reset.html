{{ define "password_reset" }}
<html>
{{template "head" .}}
<body>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
    <tr>
      <td align="center" class="wrapper-cell">
        <table role="presentation" class="card" width="552" cellpadding="0" cellspacing="0" border="0">
          {{template "navbar" .}}
          <tr>
            <td class="content">
              <p class="title">Şifreni sıfırla</p>
              <p class="subtitle">Merhaba {{.FullName}}, yeni bir şifre seçmek için aşağıdaki düğmeye tıkla. Bağlantı bir kez çalışır ve 1 saat içinde geçersiz olur.</p>
              <table role="presentation" class="action" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr><td><a class="btn" href="{{.ResetURL}}">Yeni şifre seç</a></td></tr>
              </table>
            </td>
          </tr>
          {{template "footer" .}}
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
{{ end }}
