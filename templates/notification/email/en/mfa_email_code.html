{{ define "mfa_email_code" }}
<html>
{{template "head" .}}
<body>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
    <tr>
      <td align="center" class="wrapper-cell">
        <table role="presentation" class="card" width="552" cellpadding="0" cellspacing="0" border="0">
          {{template "navbar" .}}
          <tr>
            <td class="content">
              <p class="title">Your sign-in code</p>
              <p class="subtitle">Hi {{.FullName}}, enter this code to finish signing in. It is valid for 3 minutes.</p>
              <table role="presentation" class="action" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr><td>
                  <table role="presentation" class="code-box" width="100%" cellpadding="0" cellspacing="0" border="0">
                    <tr><td>{{.Code}}</td></tr>
                  </table>
                </td></tr>
              </table>
            </td>
          </tr>
          {{template "footer" .}}
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
{{ end }}
