{{ define "password_reset" }}
<html>
{{template "head" .}}
<body>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
    <tr>
      <td align="center" class="wrapper-cell">
        <table role="presentation" class="card" width="552" cellpadding="0" cellspacing="0" border="0">
          {{template "navbar" .}}
          <tr>
            <td class="content">
              <p class="title">Reset your password</p>
              <p class="subtitle">Hi {{.FullName}}, click the button below to choose a new password. The link works once and expires in 1 hour.</p>
              <table role="presentation" class="action" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr><td><a class="btn" href="{{.ResetURL}}">Choose a new password</a></td></tr>
              </table>
            </td>
          </tr>
          {{template "footer" .}}
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
{{ end }}
