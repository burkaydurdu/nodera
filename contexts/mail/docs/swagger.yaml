      source:
        type: string
      subject:
        type: string
      tags:
        items:
          type: string
        type: array
    type: object
  github_com_piggystats_nodera_contexts_mail_application_dto.MessagePage:
    properties:
      items:
        items:
          $ref: '#/definitions/github_com_piggystats_nodera_contexts_mail_application_dto.MessageSummary'
        type: array
      next_cursor:
        type: string
    type: object
  github_com_piggystats_nodera_contexts_mail_application_dto.MessageSummary:
    properties:
      created_at:
        type: string
      from:
        type: string
      id:
        type: string
      recipients:
        items:
          $ref: '#/definitions/github_com_piggystats_nodera_contexts_mail_application_dto.RecipientSummary'
        type: array
      source:
        type: string
      subject:
        type: string
      tags:
        items:
          type: string
        type: array
    type: object
  github_com_piggystats_nodera_contexts_mail_application_dto.Overview:
    properties:
      billing_status:
        type: string
      daily_limit:
        $ref: '#/definitions/github_com_piggystats_nodera_contexts_mail_application_dto.DailyLimit'
      package:
        $ref: '#/definitions/github_com_piggystats_nodera_contexts_mail_application_dto.HeldPackage'
      pause:
        $ref: '#/definitions/github_com_piggystats_nodera_contexts_mail_application_dto.Pause'
      period:
        $ref: '#/definitions/github_com_piggystats_nodera_contexts_mail_application_dto.Period'
      project_id:
        type: string
      rates:
        $ref: '#/definitions/github_com_piggystats_nodera_contexts_mail_application_dto.Rates'
      scheduled_change:
        $ref: '#/definitions/github_com_piggystats_nodera_contexts_mail_application_dto.ScheduledChange'
