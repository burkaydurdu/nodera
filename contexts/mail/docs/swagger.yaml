    type: object
  github_com_piggystats_nodera_contexts_mail_application_dto.Rates:
    properties:
      bounce_rate:
        type: string
      complaint_rate:
        type: string
      sent:
        type: integer
      window_days:
        type: integer
    type: object
  github_com_piggystats_nodera_contexts_mail_application_dto.RecipientDetail:
    properties:
      address:
        type: string
      events:
        items:
          $ref: '#/definitions/github_com_piggystats_nodera_contexts_mail_application_dto.Event'
        type: array
      kind:
        type: string
      status:
        type: string
    type: object
  github_com_piggystats_nodera_contexts_mail_application_dto.RecipientSummary:
    properties:
      address:
        type: string
      status:
        type: string
    type: object
  github_com_piggystats_nodera_contexts_mail_application_dto.Record:
    properties:
      checked_at:
        type: string
      host:
        type: string
      purpose:
        type: string
      type:
        type: string
      valid:
        type: boolean
      value:
        type: string
    type: object
  github_com_piggystats_nodera_contexts_mail_application_dto.Response:
    properties:
      code:
        type: integer
      enhanced_code:
        type: string
      text:
        type: string
    type: object
  github_com_piggystats_nodera_contexts_mail_application_dto.ScheduledChange:
    properties:
      code:
        description: Code is a Package, or "none" for a cancellation.
        type: string
