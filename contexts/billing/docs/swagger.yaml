basePath: /
definitions:
  github_com_piggystats_nodera_contexts_billing_aggregates_invoice.PayRequest:
    properties:
      payment_method_id:
        type: string
    type: object
  github_com_piggystats_nodera_contexts_billing_aggregates_paymentmethod.CompleteVerificationRequest:
    properties:
      callback:
        additionalProperties:
          type: string
        type: object
      verification_id:
        type: string
    required:
    - verification_id
    type: object
  github_com_piggystats_nodera_contexts_billing_aggregates_profile.PutRequest:
    properties:
      account_type:
        enum:
        - individual
        - company
        type: string
      address_line1:
        maxLength: 200
        type: string
      address_line2:
        maxLength: 200
        type: string
      city:
        maxLength: 100
        type: string
      country:
        type: string
      invoice_email:
        maxLength: 254
        type: string
      legal_name:
        maxLength: 200
        type: string
      postal_code:
        maxLength: 20
        type: string
      tax_id:
        maxLength: 32
        type: string
      tax_office:
        maxLength: 100
        type: string
      vat_id:
        maxLength: 32
        type: string
    required:
    - account_type
    - address_line1
    - city
    - country
    - invoice_email
    - legal_name
    type: object
  github_com_piggystats_nodera_contexts_billing_application_dto.BillingStatus:
    properties:
      deletion_at:
        type: string
      next_retry_at:
        type: string
      open_invoice_id:
        type: string
      status:
        enum:
        - no_payment_method
        - active
        - suspended
        type: string
      suspended_at:
        type: string
    type: object
  github_com_piggystats_nodera_contexts_billing_application_dto.CardVerification:
    properties:
      redirect_url:
        type: string
      verification_id:
        type: string
    type: object
  github_com_piggystats_nodera_contexts_billing_application_dto.ConfirmationStart:
    properties:
      html_content:
        type: string
      redirect_url:
        type: string
    type: object
  github_com_piggystats_nodera_contexts_billing_application_dto.Invoice:
    properties:
      credit_applied:
        example: "0.00"
        type: string
      currency:
        example: USD
        type: string
      exchange_rate:
        example: "41.6512"
        type: string
      exchange_rate_date:
        example: "2026-10-30"
        type: string
      id:
        type: string
      issued_at:
        type: string
      kind:
        enum:
        - period
        - threshold
        type: string
      lines:
        items:
          $ref: '#/definitions/github_com_piggystats_nodera_contexts_billing_application_dto.InvoiceLine'
        type: array
      number:
        example: NDR-2026-000001
        type: string
      paid_at:
        type: string
      payments:
        items:
          $ref: '#/definitions/github_com_piggystats_nodera_contexts_billing_application_dto.Payment'
        type: array
      pdf_available:
        type: boolean
      period_end:
        type: string
      period_start:
        type: string
      settlement_amount:
        example: "4998.14"
        type: string
      settlement_currency:
        example: TRY
        type: string
      status:
        enum:
        - issued
        - paid
        - payment_failed
        - void
        type: string
      subtotal:
        example: "100.00"
        type: string
      tax_lines:
        items:
          $ref: '#/definitions/github_com_piggystats_nodera_contexts_billing_application_dto.TaxLine'
        type: array
      tax_total:
        example: "20.00"
        type: string
      total_due:
        example: "120.00"
        type: string
    type: object
  github_com_piggystats_nodera_contexts_billing_application_dto.InvoiceLine:
    properties:
      amount:
        example: "0.83"
        type: string
      droplet_id:
        type: string
      hostname:
        type: string
      hourly_price:
        example: "0.2766"
        type: string
      hours:
        example: 3
        type: integer
      plan_code:
        type: string
    type: object
  github_com_piggystats_nodera_contexts_billing_application_dto.InvoiceSummary:
    properties:
      currency:
        example: USD
        type: string
      id:
        type: string
      issued_at:
        type: string
      kind:
        enum:
        - period
        - threshold
        type: string
      number:
        example: NDR-2026-000001
        type: string
      paid_at:
        type: string
      period_end:
        type: string
      period_start:
        type: string
      settlement_amount:
        example: "4998.14"
        type: string
      settlement_currency:
        example: TRY
        type: string
      status:
        enum:
        - issued
        - paid
        - payment_failed
        - void
        type: string
      total_due:
        example: "120.00"
        type: string
    type: object
  github_com_piggystats_nodera_contexts_billing_application_dto.Payment:
    properties:
      amount:
        example: "4998.14"
        type: string
      confirmation_url:
        type: string
      created_at:
        type: string
      currency:
        example: TRY
        type: string
      failure_reason:
        example: insufficient_funds
        type: string
      id:
        type: string
      invoice_id:
        type: string
      status:
        enum:
        - pending
        - succeeded
        - failed
        - confirmation_required
        type: string
    type: object
  github_com_piggystats_nodera_contexts_billing_application_dto.PaymentMethod:
    properties:
      brand:
        example: visa
        type: string
      created_at:
        type: string
      currency:
        example: TRY
        type: string
      exp_month:
        example: 12
        type: integer
      exp_year:
        example: 2030
        type: integer
      id:
        type: string
      is_default:
        type: boolean
      last4:
        example: "4242"
        type: string
      team_id:
        type: string
    type: object
  github_com_piggystats_nodera_contexts_billing_application_dto.Profile:
    properties:
      account_type:
        enum:
        - individual
        - company
        type: string
      address_line1:
        type: string
      address_line2:
        type: string
      city:
        type: string
      country:
        example: TR
        type: string
      created_at:
        type: string
      invoice_email:
        type: string
      legal_name:
        type: string
      postal_code:
        type: string
      tax_id:
        type: string
      tax_office:
        type: string
      team_id:
        type: string
      updated_at:
        type: string
      vat_id:
        type: string
    type: object
  github_com_piggystats_nodera_contexts_billing_application_dto.TaxLine:
    properties:
      amount:
        example: "20.00"
        type: string
      base:
        example: "100.00"
        type: string
      label:
        example: KDV %20
        type: string
      rate_bps:
        example: 2000
        type: integer
    type: object
  github_com_piggystats_nodera_contexts_billing_application_dto.Usage:
    properties:
      estimated_tax:
        example: "2.48"
        type: string
      estimated_total:
        example: "14.88"
        type: string
      lines:
        items:
          $ref: '#/definitions/github_com_piggystats_nodera_contexts_billing_application_dto.UsageLine'
        type: array
      period_end:
        type: string
      period_start:
        type: string
      subtotal:
        example: "12.40"
        type: string
      threshold:
        $ref: '#/definitions/github_com_piggystats_nodera_contexts_billing_application_dto.UsageThreshold'
    type: object
  github_com_piggystats_nodera_contexts_billing_application_dto.UsageLine:
    properties:
      amount:
        example: "0.83"
        type: string
      droplet_id:
        type: string
      hostname:
        type: string
      hourly_price:
        example: "0.2766"
        type: string
      hours:
        example: 3
        type: integer
      plan_code:
        type: string
    type: object
  github_com_piggystats_nodera_contexts_billing_application_dto.UsageThreshold:
    properties:
      amount:
        example: "50.00"
        type: string
      kind:
        enum:
        - new
        - established
        type: string
    type: object
  github_com_piggystats_nodera_contexts_billing_application_dto.WebhookReceipt:
    properties:
      received:
        type: boolean
    type: object
info:
  contact: {}
  description: Billing profile, payment methods, usage, invoices, payments, billing
    status and payment provider webhooks of a Team. Money is USD excluding taxes unless
    a currency says otherwise.
  title: Nodera Billing API
  version: "1.0"
paths:
  /v1/billing/invoices/{invoiceID}/pdf:
    get:
      description: 'Public: expires and token come from the signed link (pdf_url of
        InvoiceIssued). 410 invoice 33-10005 for a forged, foreign or expired link.'
      parameters:
      - description: Invoice id
        in: path
        name: invoiceID
        required: true
        type: string
      - description: Link expiry, Unix seconds
        in: query
        name: expires
        required: true
        type: integer
      - description: Link signature
        in: query
        name: token
        required: true
        type: string
      produces:
      - application/pdf
      responses:
        "200":
          description: OK
          schema:
            type: file
      summary: The Invoice PDF behind the issue email's link
      tags:
      - billing
  /v1/billing/payments/{paymentID}/3ds/callback:
    post:
      consumes:
      - application/x-www-form-urlencoded
      description: Public, posted by the provider's page as a form. The link token
        and the provider's own hash must both verify (401 payment 34-10011 otherwise);
        the charge is then completed and the browser redirected to {front}/billing/confirm?payment=<id>&result=succeeded|failed.
      parameters:
      - description: Payment id
        in: path
        name: paymentID
        required: true
        type: string
      - description: Confirmation token
        in: query
        name: token
        required: true
        type: string
      responses:
        "302":
          description: Found
      summary: Where the payment provider returns the cardholder after 3-D Secure
      tags:
      - billing
  /v1/billing/payments/{paymentID}/3ds/start:
    post:
      description: 'Public: the token from the confirmation email authorizes this
        one Payment. Answers html_content (a full HTML document to render) or redirect_url,
        never neither. 410 payment 34-10002 for a bad or expired token; 409 34-10009
        when the Payment is not awaiting confirmation; 402 34-10010 when the card
        is declined; 502 34-10008 when the bank''s step cannot be opened.'
      parameters:
      - description: Payment id
        in: path
        name: paymentID
        required: true
        type: string
      - description: Confirmation token
        in: query
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_piggystats_nodera_contexts_billing_application_dto.ConfirmationStart'
      summary: Open the bank's 3-D Secure step for a Payment awaiting the cardholder
      tags:
      - billing
  /v1/billing/payments/{paymentID}/confirm:
    get:
      description: 'Public: the token from the confirmation email authorizes this
        one Payment. Answers its status and calls no provider; the 3-D Secure step
        starts with POST .../3ds/start. 410 payment 34-10002 for an unknown Payment
        or an invalid or expired token.'
      parameters:
      - description: Payment id
        in: path
        name: paymentID
        required: true
        type: string
      - description: Confirmation token
        in: query
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_piggystats_nodera_contexts_billing_application_dto.Payment'
      summary: The Payment behind a confirmation link, as it stands
      tags:
      - billing
  /v1/billing/webhooks/craftgate:
    post:
      consumes:
      - application/json
      description: Public. 401 34-10001 on a bad signature; otherwise 200, stored
        once per provider event id and reconciled asynchronously.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_piggystats_nodera_contexts_billing_application_dto.WebhookReceipt'
      summary: Payment provider notification
      tags:
      - billing
  /v1/billing/webhooks/stripe:
    post:
      consumes:
      - application/json
      description: Public. 401 34-10001 on a bad signature; otherwise 200, stored
        once per provider event id and reconciled asynchronously.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_piggystats_nodera_contexts_billing_application_dto.WebhookReceipt'
      summary: Payment provider notification
      tags:
      - billing
  /v1/teams/{teamID}/billing/invoices:
    get:
      parameters:
      - description: Team id
        in: path
        name: teamID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_piggystats_nodera_contexts_billing_application_dto.InvoiceSummary'
            type: array
      security:
      - BearerAuth: []
      summary: The Team's Invoices, newest first
      tags:
      - billing
  /v1/teams/{teamID}/billing/invoices/{invoiceID}:
    get:
      description: 404 invoice 33-10001 for an unknown Invoice or another Team's.
        Needs billing.read.
      parameters:
      - description: Team id
        in: path
        name: teamID
        required: true
        type: string
      - description: Invoice id
        in: path
        name: invoiceID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_piggystats_nodera_contexts_billing_application_dto.Invoice'
      security:
      - BearerAuth: []
      summary: One Invoice with its lines, Tax lines and Payments
      tags:
      - billing
  /v1/teams/{teamID}/billing/invoices/{invoiceID}/pay:
    post:
      consumes:
      - application/json
      description: 'With the default card, or payment_method_id for another saved
        card. 409 invoice 33-10002 when paid or void; 429 payment 34-10003 past 5
        attempts an hour per Team (Retry-After set). The answer is the attempt as
        it stands: succeeded, failed, pending, or confirmation_required with the bank''s
        page. Needs billing.write.'
      parameters:
      - description: Team id
        in: path
        name: teamID
        required: true
        type: string
      - description: Invoice id
        in: path
        name: invoiceID
        required: true
        type: string
      - description: Another saved card
        in: body
        name: request
        schema:
          $ref: '#/definitions/github_com_piggystats_nodera_contexts_billing_aggregates_invoice.PayRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/github_com_piggystats_nodera_contexts_billing_application_dto.Payment'
      security:
      - BearerAuth: []
      summary: Charge the Invoice now
      tags:
      - billing
  /v1/teams/{teamID}/billing/invoices/{invoiceID}/pdf:
    get:
      description: A statement until an e-invoice issuer is connected. 503 invoice
        33-10006 when it cannot be rendered right now. Needs billing.read.
      parameters:
      - description: Team id
        in: path
        name: teamID
        required: true
        type: string
      - description: Invoice id
        in: path
        name: invoiceID
        required: true
        type: string
      produces:
      - application/pdf
      responses:
        "200":
          description: OK
          schema:
            type: file
      security:
      - BearerAuth: []
      summary: The Invoice's PDF
      tags:
      - billing
  /v1/teams/{teamID}/billing/payment-methods:
    get:
      parameters:
      - description: Team id
        in: path
        name: teamID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_piggystats_nodera_contexts_billing_application_dto.PaymentMethod'
            type: array
      security:
      - BearerAuth: []
      summary: The Team's saved cards, default first
      tags:
      - billing
  /v1/teams/{teamID}/billing/payment-methods/{methodID}:
    delete:
      description: 409 31-10003 for the default while other cards exist; 409 31-10004
        for the last card while an Invoice is unpaid. Needs billing.write.
      parameters:
      - description: Team id
        in: path
        name: teamID
        required: true
        type: string
      - description: Payment method id
        in: path
        name: methodID
        required: true
        type: string
      responses:
        "204":
          description: No Content
      security:
      - BearerAuth: []
      summary: Delete a card
      tags:
      - billing
  /v1/teams/{teamID}/billing/payment-methods/{methodID}/default:
    put:
      parameters:
      - description: Team id
        in: path
        name: teamID
        required: true
        type: string
      - description: Payment method id
        in: path
        name: methodID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_piggystats_nodera_contexts_billing_application_dto.PaymentMethod'
      security:
      - BearerAuth: []
      summary: Make a card the one charged
      tags:
      - billing
  /v1/teams/{teamID}/billing/payment-methods/verify:
    post:
      description: Answers where to send the browser; the form returns to {front}/billing/cards/complete?verification=<id>.
        409 31-10002 without a Billing profile. Needs billing.write.
      parameters:
      - description: Team id
        in: path
        name: teamID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_piggystats_nodera_contexts_billing_application_dto.CardVerification'
      security:
      - BearerAuth: []
      summary: Open the hosted card form
      tags:
      - billing
  /v1/teams/{teamID}/billing/payment-methods/verify/complete:
    post:
      consumes:
      - application/json
      description: The first card becomes the default and lifts the payment-method
        block on Droplet creation. 402 31-10005 when the card was not verified; 404
        31-10006 for an unknown verification. Needs billing.write.
      parameters:
      - description: Team id
        in: path
        name: teamID
        required: true
        type: string
      - description: Verification id and the parameters the form returned with
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_piggystats_nodera_contexts_billing_aggregates_paymentmethod.CompleteVerificationRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_piggystats_nodera_contexts_billing_application_dto.PaymentMethod'
      security:
      - BearerAuth: []
      summary: Save the card the hosted form verified
      tags:
      - billing
  /v1/teams/{teamID}/billing/profile:
    get:
      description: 404 profile 30-10001 when the Team has none yet. 403 without billing.read;
        404 access 37-10001 for a Team the caller is not in.
      parameters:
      - description: Team id
        in: path
        name: teamID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_piggystats_nodera_contexts_billing_application_dto.Profile'
      security:
      - BearerAuth: []
      summary: The Team's Billing profile
      tags:
      - billing
    put:
      consumes:
      - application/json
      description: TR company needs a 10-digit VKN in tax_id and tax_office; TR individual
        needs a valid TCKN in tax_id (400 30-10004). Changing the country while cards
        are saved is 409 30-10003. Needs billing.write.
      parameters:
      - description: Team id
        in: path
        name: teamID
        required: true
        type: string
      - description: Billing profile
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_piggystats_nodera_contexts_billing_aggregates_profile.PutRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_piggystats_nodera_contexts_billing_application_dto.Profile'
      security:
      - BearerAuth: []
      summary: Create or replace the Team's Billing profile
      tags:
      - billing
  /v1/teams/{teamID}/billing/status:
    get:
      description: Readable by every member (team.read); carries no amounts.
      parameters:
      - description: Team id
        in: path
        name: teamID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_piggystats_nodera_contexts_billing_application_dto.BillingStatus'
      security:
      - BearerAuth: []
      summary: Whether the Team may spend
      tags:
      - billing
  /v1/teams/{teamID}/billing/usage:
    get:
      description: Each Droplet's hours not yet on an Invoice this Period (rounded
        up, capped at 672), priced at its Locked price; tax estimated with the Billing
        profile's Tax rule (0 without a profile); and the Threshold that issues it
        early. Needs billing.read.
      parameters:
      - description: Team id
        in: path
        name: teamID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_piggystats_nodera_contexts_billing_application_dto.Usage'
      security:
      - BearerAuth: []
      summary: The open Period's draft Invoice
      tags:
      - billing
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
